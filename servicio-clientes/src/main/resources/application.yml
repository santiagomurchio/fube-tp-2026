server:
  port: 8081

spring:
  application:
    name: servicio-clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

feature-flags:
  mask-pii: true      # valor del modo local

pedidos:
  base-url: ${PEDIDOS_BASE_URL:http://localhost:8083}
